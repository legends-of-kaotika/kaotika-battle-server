# Local end-to-end orchestration for the three battle applications.
# Run from this directory with:
#   docker compose -f docker-compose.e2e.yml up --build -d

services:
  server:
    build:
      context: .
    container_name: kaotika-battle-server
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID is required}
      CORS_ORIGIN: http://localhost:5000,http://localhost:5001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: ../../ReactProjects/kaotika-battle-web
      args:
        VITE_SERVER_URL: http://localhost:3000
    container_name: kaotika-battle-web
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "5000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 12

  mobile:
    build:
      context: ../../NextJSProjects/kaotika-battle-mobile
      args:
        VITE_SOCKET_URL: http://localhost:3000
      secrets:
        - mobile_env
    container_name: kaotika-battle-mobile
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "5001:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 12

secrets:
  mobile_env:
    file: ../../NextJSProjects/kaotika-battle-mobile/.env
