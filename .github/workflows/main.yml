name: Deploy Kaotika Battle Server (Docker)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    concurrency:
      group: kaotika-battle-server-production
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create runtime environment file
        env:
          ENV_FILE: ${{ secrets.MOBILE_ENV_FILE }}
        run: printf '%s' "$ENV_FILE" > .env

      - name: Validate deployment secrets
        env:
          MONGODB_ROUTE: ${{ secrets.MONGODB_ROUTE }}
        run: |
          if [ -z "$MONGODB_ROUTE" ]; then
            echo "MONGODB_ROUTE GitHub secret is required"
            exit 1
          fi

      - name: Build and restart Docker container
        env:
          MONGODB_ROUTE: ${{ secrets.MONGODB_ROUTE }}
          CONTAINER_NAME: kaotika-battle-server
        run: |
          docker compose -f docker-compose.yml build server
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          docker compose -f docker-compose.yml up -d server

      - name: Verify deployment
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent http://localhost:3000/health >/dev/null; then
              echo "Deployment healthy"
              exit 0
            fi
            sleep 5
          done
          docker logs kaotika-battle-server
          exit 1

      - name: Remove runtime environment file
        if: always()
        run: rm -f .env
