services:
  server:
    build: .
    container_name: kaotika-battle-server
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_ROUTE: ${MONGODB_ROUTE:?MONGODB_ROUTE is required}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
